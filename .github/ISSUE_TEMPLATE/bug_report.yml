name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not** include real account numbers, tax IDs or other personal data — use placeholder values.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code that reproduces the issue (input params or the BIHUPP10 payload string).
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bihupp-js version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      multiple: true
      options:
        - Node.js
        - Browser
        - React Native
        - Next.js
        - Deno / Bun
        - Other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime / TypeScript / zod versions
      placeholder: "Node 22.10, TypeScript 5.7, zod 4.1"
  - type: dropdown
    id: bank
    attributes:
      label: Is this about a bank rejecting the generated QR code?
      options:
        - "No"
        - "Yes"
  - type: input
    id: bank_name
    attributes:
      label: Bank / app name (if applicable)
